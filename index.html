<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Son en Transito - Portafolio de investigación doctoral y arte sonoro. Explorando la fenomenología del sonido, migración y creación algorítmica.">
    <title>son en transito</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Neon accents - kept vibrant for brand identity
                        neonPink: '#ff00ff',
                        neonYellow: '#dfff00',
                        neonGreen: '#a3e635',
                        neonOrange: '#ff5f1f',
                        
                        // Backgrounds
                        darkBg: '#0a0a0a',
                        lightBg: '#fafafa',
                        
                        // Text colors - WCAG 2.1 AA compliant (4.5:1 contrast ratio minimum)
                        contentDark: '#0a0a0a',
                        contentLight: '#e8e8e8',
                        
                        // Accessible grays with proper contrast
                        gray: {
                            50: '#fafafa',
                            100: '#f4f4f5',
                            200: '#e4e4e7',
                            300: '#d4d4d8',
                            400: '#a1a1aa',  // 4.6:1 on dark bg
                            500: '#71717a',  // 5.1:1 on light bg
                            600: '#52525b',  // 6.3:1 on light bg
                            700: '#3f3f46',  // 9.4:1 on light bg
                            800: '#27272a',
                            900: '#18181b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    fontSize: {
                        // Accessible base sizes
                        xs: ['0.75rem', { lineHeight: '1.5' }],
                        sm: ['0.875rem', { lineHeight: '1.6' }],
                        base: ['1rem', { lineHeight: '1.7' }],
                        lg: ['1.125rem', { lineHeight: '1.7' }],
                        xl: ['1.25rem', { lineHeight: '1.6' }],
                        '2xl': ['1.5rem', { lineHeight: '1.5' }],
                        '3xl': ['1.875rem', { lineHeight: '1.4' }],
                        '4xl': ['2.25rem', { lineHeight: '1.3' }],
                        '5xl': ['3rem', { lineHeight: '1.2' }],
                        '6xl': ['3.75rem', { lineHeight: '1.1' }],
                    },
                    lineHeight: {
                        relaxed: '1.625',
                        loose: '2',
                    },
                    screens: {
                        'xs': '475px',
                    }
                }
            }
        }
    </script>
    <style>
        /* Global accessibility improvements */
        html {
            scroll-behavior: smooth;
        }
        
        body {
            transition: background-color 0.5s ease, color 0.5s ease;
            font-family: 'Inter', system-ui, sans-serif;
            letter-spacing: -0.01em;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Improved text contrast for dark mode */
        .dark body {
            color: #e8e8e8; /* WCAG AA compliant on #0a0a0a */
        }
        
        /* Readable body text */
        p, li, td, th {
            line-height: 1.7;
        }
        
        /* Focus states for accessibility */
        *:focus-visible {
            outline: 2px solid #ff5f1f;
            outline-offset: 2px;
        }
        
        /* Skip link for keyboard navigation */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #ff5f1f;
            color: white;
            padding: 8px 16px;
            z-index: 100;
            font-weight: bold;
        }
        
        .skip-link:focus {
            top: 0;
        }
        
        /* Improved contrast for secondary text */
        .text-muted {
            color: #71717a; /* 5.1:1 on white */
        }
        
        .dark .text-muted {
            color: #a1a1aa; /* 4.6:1 on dark */
        }
        
        /* Background noise texture */
        .bg-noise {
            background-image: url("https://www.transparenttextures.com/patterns/cubes.png");
            background-attachment: fixed;
            opacity: 0.03;
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .dark .bg-noise {
            background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
            opacity: 0.08;
        }

        /* Neogrotesque typography */
        h1, h2, h3 {
            letter-spacing: -0.04em;
            line-height: 1.2;
        }
        
        /* Responsive single column for mobile */
        @media (max-width: 767px) {
            .grid {
                grid-template-columns: 1fr !important;
            }
            
            .md\:grid-cols-2,
            .md\:grid-cols-3,
            .lg\:grid-cols-2,
            .lg\:grid-cols-3 {
                grid-template-columns: 1fr;
            }
            
            /* Stack flex containers on mobile */
            .md\:flex-row {
                flex-direction: column;
            }
            
            /* Reduce padding on mobile */
            .px-8 {
                padding-left: 1rem;
                padding-right: 1rem;
            }
            
            /* Readable font sizes on mobile */
            h1 {
                font-size: 2.5rem !important;
            }
            
            h2 {
                font-size: 1.75rem !important;
            }
        }
        
        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }
        
        /* High contrast mode support */
        @media (prefers-contrast: high) {
            body {
                --neon-orange: #ff7f3f;
                --neon-pink: #ff4fff;
            }
            
            .border-black\/5,
            .border-white\/5 {
                border-color: currentColor !important;
                border-width: 2px !important;
            }
        }
    </style>

</head>

<body class="bg-lightBg dark:bg-darkBg text-contentDark dark:text-contentLight">
    <!-- Skip link for keyboard accessibility -->
    <a href="#main-content" class="skip-link">Saltar al contenido principal</a>
    
    <div class="bg-noise" aria-hidden="true"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>

</html>
