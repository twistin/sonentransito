    <style>
        /* Global accessibility improvements */
        html {
            scroll-behavior: smooth;
        }

        body {
            transition: background-color 0.5s ease, color 0.5s ease;
            font-family: 'Inter', system-ui, sans-serif;
            letter-spacing: -0.01em;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Improved text contrast for dark mode */
        .dark body {
            color: #e8e8e8;
            /* WCAG AA compliant on #0a0a0a */
        }

        /* Readable body text */
        p,
        li,
        td,
        th {
            line-height: 1.7;
        }

        /* Focus states for accessibility */
        *:focus-visible {
            outline: 2px solid #ff5f1f;
            outline-offset: 2px;
        }

        /* Skip link for keyboard navigation */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 0;
            background: #ff5f1f;
            color: white;
            padding: 8px 16px;
            z-index: 100;
            font-weight: bold;
        }

        .skip-link:focus {
            top: 0;
        }

        /* Improved contrast for secondary text */
        .text-muted {
            color: #71717a;
            /* 5.1:1 on white */
        }

        .dark .text-muted {
            color: #a1a1aa;
            /* 4.6:1 on dark */
        }

        /* Background noise texture */
        .bg-noise {
            background-image: url("https://www.transparenttextures.com/patterns/cubes.png");
            background-attachment: fixed;
            opacity: 0.03;
            pointer-events: none;
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        .dark .bg-noise {
            background-image: url("https://www.transparenttextures.com/patterns/carbon-fibre.png");
            opacity: 0.08;
        }

        /* Neogrotesque typography */
        h1,
        h2,
        h3 {
            letter-spacing: -0.04em;
            line-height: 1.2;
        }

        /* Responsive single column for mobile */
        @media (max-width: 767px) {
            .grid {
                grid-template-columns: 1fr !important;
            }

            .md\:grid-cols-2,
            .md\:grid-cols-3,
            .lg\:grid-cols-2,
            .lg\:grid-cols-3 {
                grid-template-columns: 1fr;
            }

            /* Stack flex containers on mobile */
            .md\:flex-row {
                flex-direction: column;
            }

            /* Reduce padding on mobile */
            .px-8 {
                padding-left: 1rem;
                padding-right: 1rem;
            }

            /* Readable font sizes on mobile */
            h1 {
                font-size: 2.5rem !important;
            }

            h2 {
                font-size: 1.75rem !important;
            }
        }

        /* Reduced motion preference */
        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

        /* High contrast mode support */
        @media (prefers-contrast: high) {
            body {
                --neon-orange: #ff7f3f;
                --neon-pink: #ff4fff;
            }

            .border-black\/5,
            .border-white\/5 {
                border-color: currentColor !important;
                border-width: 2px !important;
            }
        }
